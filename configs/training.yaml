# Training config (merged over default.yaml)
env:
  n_uavs: 15
  n_tasks: 45
  horizon: 300
train:
  algo: mappo                # mappo | ippo
  iterations: 40
  episodes_per_iter: 6
  lr_actor: 1.0e-4           # lowered from 3e-4 for fine-tuning a behaviour-cloned actor (see docs/experiments.md)
  lr_critic: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip: 0.2
  epochs: 5
  minibatch_size: 256
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  lr_schedule: false
  normalize_adv: true
  critic_warmup_iters: 3     # critic-only iterations before the actor is updated
  eval_every: 5
  eval_episodes: 4
  device: auto
  log_dir: results/tb
  out_dir: checkpoints
  bc:
    enabled: false
    episodes: 10
    epochs: 10
    lr: 1.0e-3
  randomization:             # per-episode domain randomization (uniform ranges)
    enabled: true
    fleet_sizes: [10, 15, 20]
    n_tasks_per_uav: [2.5, 4.5]
    capacity: [30.0, 50.0]
    speed: [12.0, 18.0]
    wind_std: [0.5, 3.0]
    comm_range: [250.0, 500.0]
    loss_prob: [0.0, 0.2]
    delay_max: [1, 3]
    failure_rate: [0.0, 0.0005]
    deadline_tightness: [0.7, 1.3]
    priority_skew: [0.0, 1.0]   # 0 = default weights, 1 = heavy-tailed toward high priority
